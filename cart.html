<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping cart - Catstore</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Catstore</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="cats.html">Cats</a>
            <a href="cart.html" class="active">
                Shopping cart
                <span id="cart-badge" class="cart-badge">0</span>
            </a>
            <a href="about.html">About us</a>
        </nav>
        <button class="nav-toggle">&#9776;</button>
    </header>

    <main>
        <div class="page-header">
            <h1>Shopping cart</h1>
            <p>Review your selection and place your order</p>
        </div>

        <div class="cart-layout">
            <div class="cart-items-section">
                <h2>Your cats</h2>
                <div id="cart-items-container"></div>
            </div>

            <div class="order-form-section">
                <h2>Your details</h2>
                <form id="order-form" novalidate>
                    <div class="form-group">
                        <label for="customer-name">Name</label>
                        <input type="text" id="customer-name" placeholder="Your full name" />
                        <span class="field-error" id="name-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="customer-email">Email</label>
                        <input type="email" id="customer-email" placeholder="you@email.com" />
                        <span class="field-error" id="email-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="customer-address">Address</label>
                        <textarea id="customer-address" rows="3" placeholder="Street, zip code, city"></textarea>
                        <span class="field-error" id="address-error"></span>
                    </div>
                    <button type="submit" class="btn-primary" style="width:100%; text-align:center; border:none; cursor:pointer;">
                        Place order
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>Catstore &copy; 2026</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
